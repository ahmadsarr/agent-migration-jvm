name: Goal executor tests
on:
  pull_request:
    paths:
      - 'scripts/goal_executor.py'
      - 'tests/test_goal_executor.py'
      - '.github/workflows/goal-executor.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_goal_executor.py' -v
